name: "Deploy Site"

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-site:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.14-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Site
        run: make site

      - name: Store Site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/html

  deploy-site:
    runs-on: ubuntu-latest

    needs:
      - build-site

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v5


# The end.
