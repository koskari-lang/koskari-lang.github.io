<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -10 114 114" width="64" height="64"
     role="img" aria-label="Koskari">
  <defs>
    <radialGradient id="ko-skin" cx="33%" cy="24%" r="90%">
      <stop offset="0" stop-color="#f3d883"/>
      <stop offset="0.36" stop-color="#e6b73f"/>
      <stop offset="0.74" stop-color="#cc9420"/>
      <stop offset="1" stop-color="#a9761a"/>
    </radialGradient>
    <radialGradient id="ko-flesh" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#fdf5da"/>
      <stop offset="1" stop-color="#f1e1b6"/>
    </radialGradient>
    <linearGradient id="ko-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5d2" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#fff5d2" stop-opacity="0"/>
      <stop offset="1" stop-color="#6e4808" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="ko-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc757"/>
      <stop offset="1" stop-color="#caa033"/>
    </linearGradient>
    <linearGradient id="ko-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5418"/>
      <stop offset="1" stop-color="#9c7126"/>
    </linearGradient>
    <filter id="ko-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5"
          flood-color="#785a0a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#ko-shadow)">

    <!-- stem (behind the body, leaning right) -->
    <rect x="47" y="-3" width="7" height="24" rx="3" ry="3"
        fill="url(#ko-stem)" transform="rotate(10 50.5 15)"/>

    <!-- leaf (upper-right, pointed along the TL-BR diagonal) -->
    <path id="ko-leaf" d="M44 1 Q12 1 12 20 Q44 20 44 1 Z"
      fill="url(#ko-leaf)" stroke="#b78d28" stroke-width="0.6"
      stroke-opacity="0.7" transform="rotate(20 43.36 19.62)"/>

    <!-- apple body: true apple silhouette, not an ellipse -->
    <path d="M48.16 9 L51.84 9
             A44.16 39.65 0 0 1 96 48.65 L96 48.66
             A43.24 49.34 0 0 1 52.76 98 L47.24 98
             A43.24 49.34 0 0 1 4 48.66 L4 48.65
             A44.16 39.65 0 0 1 48.16 9 Z"
        fill="url(#ko-skin)"/>

    <!-- inner shading: top sheen + bottom shadow -->
    <path d="M48.16 9 L51.84 9
             A44.16 39.65 0 0 1 96 48.65 L96 48.66
             A43.24 49.34 0 0 1 52.76 98 L47.24 98
             A43.24 49.34 0 0 1 4 48.66 L4 48.65
             A44.16 39.65 0 0 1 48.16 9 Z"
        fill="url(#ko-shade)"/>

    <!-- flesh (pale cross-section face) -->
    <path d="M48.48 16 L51.52 16
             A36.48 32.53 0 0 1 88 48.53 L88 48.53
             A35.72 40.47 0 0 1 52.28 89 L47.72 89
             A35.72 40.47 0 0 1 12 48.53 L12 48.53
             A36.48 32.53 0 0 1 48.48 16 Z"
        fill="url(#ko-flesh)" stroke="#b48c28" stroke-width="1"
        stroke-opacity="0.35"/>
  </g>

  <!-- lambda core: straight main diagonal + short branch, solid junction -->
  <g fill="none" stroke="#b07d12" stroke-width="7.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 32 L64 70"/>
    <path d="M53 48 L40 70"/>
  </g>
</svg>
